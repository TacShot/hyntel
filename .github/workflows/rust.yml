name: Rust CI
on:
  push:
    branches: [main, "migration/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo build --release
