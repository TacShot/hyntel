[package]
name = "hyntel-installer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform net-installer for hyntel security audit tool"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
semver = "1.0"
which = "5.0"
tokio = { version = "1.0", features = ["process", "fs"] }
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
walkdir = "2.0"

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10"