[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-audit-tool"
version = "0.1.0"
description = "Cross-platform system security configuration auditing CLI for Linux, macOS, and Windows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "TacShot", email = "sarthak0111204@gmail.com" }
]
dependencies = []

[project.scripts]
security-audit = "security_audit_tool.cli:main"
security-audit-gui = "security_audit_tool.launcher:main"

[tool.setuptools.packages.find]
include = ["security_audit_tool*"]
